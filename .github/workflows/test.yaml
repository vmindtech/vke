name: VKE Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Verify mocks are up to date
        run: |
          go install go.uber.org/mock/mockgen@v0.6.0
          go generate ./...
          git diff --exit-code
      - name: Test
        id: tests
        shell: bash
        run: |
          mkdir -p test-results
          go test ./... -race -shuffle=on -count=1 -timeout=10m -json \
            -covermode=atomic -coverprofile=test-results/coverage.out \
            2> >(tee test-results/test-stderr.log >&2) | tee test-results/tests.jsonl
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: error

